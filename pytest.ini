[tool.pytest.ini_options]
# 让 `uv run pytest` 能 import 到项目根的 services/ 包
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
# anyio 自带的 pytest 插件。检索腿全是 async 端到端测试
# （tests/test_retrieval_e2e.py），需要一个 pytest 能在 loop 里跑它们。
#
# ⚠️ §5.17 的坑在这里被放大：每个 async 测试必须共用**同一个** event loop，
# 否则 `get_async_engine()` 的 asyncpg 连接池会绑定到已销毁的 loop 上，
# 报 `attached to a different loop`。
# anyio 的插件默认每个测试函数一个 loop，所以 `tests/test_retrieval_e2e.py`
# 的 `teardown_module` 里显式 `dispose_engines()`，不依赖跨测试的引擎复用。
anyio_mode = "auto"
